<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>R-SECS | Mission Control Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=JetBrains+Mono&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css">
</head>

<body style="display: none;">
  <header class="main-header">
    <div class="logo-area">
      <div class="logo-icon">
        <i class="fas fa-radar fa-spin-slow"></i>
      </div>
      <div class="logo-text">
        <h1>R-SECS</h1>
        <span>SATELLITE EMERGENCY SYSTEM</span>
      </div>
    </div>

    <div class="header-center">
      <div class="system-stat">
        <span class="label">SYSTEM STATUS</span>
        <span class="value online">OPERATIONAL</span>
      </div>
      <div id="clock" class="dashboard-clock">00:00:00</div>
    </div>

    <div class="header-tools" style="display:flex; gap:10px; margin-right:20px;">
      <button onclick="toggleAudio()" id="audioBtn" class="dispatch-btn"
        style="background:#444; width:auto; padding:5px 15px;">
        <i class="fas fa-volume-mute"></i> AUDIO: OFF
      </button>
      <button onclick="toggleMap()" id="mapBtn" class="dispatch-btn"
        style="background:#444; width:auto; padding:5px 15px;">
        <i class="fas fa-map-marked-alt"></i> MAP: OSM
      </button>
      <button onclick="location.reload()" class="dispatch-btn" style="background:#444; width:auto; padding:5px 15px;">
        <i class="fas fa-sync"></i> SYNC
      </button>
    </div>

    <div class="user-profile">
      <div class="profile-info">
        <p id="who">OFFICER_NAME</p>
        <span>PRIMARY_OPERATOR</span>
      </div>
      <div class="profile-avatar">
        <i class="fas fa-user-shield"></i>
      </div>
      <button class="logout-btn" onclick="sessionStorage.clear(); location.href='login.html'"><i
          class="fas fa-power-off"></i></button>
    </div>
  </header>

  <main class="dashboard-body">
    <section id="map" class="map-viewport"></section>

    <aside class="alerts-sidebar">
      <div class="sidebar-header">
        <h2><i class="fas fa-bolt"></i> ACTIVE INCIDENTS</h2>
        <div class="incident-counter" id="activeCounter">0</div>
      </div>

      <div id="emergencyList" class="incident-feed">
        <!-- Records injected here -->
        <div class="empty-state">
          <i class="fas fa-satellite"></i>
          <p>SCANNING FOR INCOMING SIGNALS</p>
        </div>
      </div>
    </aside>
  </main>


  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="dashboard.js"></script>
</body>

</html>
